<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas ordering — D.I.M. Bright Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
  /* ---------- Christmas banner (same as the home page banner) ---------- */
  .banner{position:relative;overflow:hidden;background:linear-gradient(90deg,#0a3a32,#0e4d42 55%,#0a3a32);color:#fff;text-align:center;padding:14px 16px;font-size:.95rem;font-weight:600;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .banner p{position:relative;z-index:2;margin:0}
  .banner strong{color:#f2b13c}
  .banner .countdown{display:inline-block;background:#f2b13c;color:#0a3a32;border:1px solid #f2b13c;border-radius:8px;padding:3px 10px;margin-left:8px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .banner a{color:#f2b13c;font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .banner a:hover{color:#fff}
  .banner .snow{position:absolute;inset:0;pointer-events:none;z-index:1}
  .banner .flake{position:absolute;top:-24px;color:#fff;line-height:1;animation-name:snowfall;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes snowfall{to{transform:translateY(220px) rotate(200deg)}}
  @media (prefers-reduced-motion: reduce){ .banner .flake{animation:none;display:none} }
</style>
</head>
<body>

<div class="banner" id="xmas-banner">
  <div class="snow" aria-hidden="true"></div>
  <p>Christmas ordering closes <strong>Friday, Dec 11</strong> — <a target="_blank" rel="noopener" href="https://www.dimbrightideas.com/christmas-gift-guide">shop personalized gifts</a> before they're gone. <span class="countdown" id="countdown"></span></p>
</div>

<script>
(function(){
  /* Falling snowflakes in the Christmas banner */
  var banner=document.getElementById('xmas-banner');
  var snow=banner.querySelector('.snow');
  for(var i=0;i<28;i++){
    var f=document.createElement('span');
    f.className='flake'; f.textContent='❄';
    f.style.left=(Math.random()*100)+'%';
    f.style.fontSize=(10+Math.random()*12).toFixed(0)+'px';
    f.style.animationDuration=(7+Math.random()*8).toFixed(1)+'s';
    f.style.animationDelay=(-Math.random()*14).toFixed(1)+'s';
    f.style.opacity=(0.5+Math.random()*0.5).toFixed(2);
    snow.appendChild(f);
  }
  /* Countdown to the Christmas order deadline */
  var target=new Date('2026-12-11T23:59:59-05:00').getTime();
  var el=document.getElementById('countdown');
  function tick(){
    var diff=target-Date.now();
    if(diff<=0){ el.textContent='Christmas ordering has closed — thank you!'; return; }
    var d=Math.floor(diff/86400000);
    var h=Math.floor(diff%86400000/3600000);
    var m=Math.floor(diff%3600000/60000);
    var s=Math.floor(diff%60000/1000);
    el.textContent=d+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s left';
  }
  tick(); setInterval(tick,1000);
})();
</script>

</body>
</html>
